<div
  class="dialog-backdrop"
  (pointerdown)="onBackdropPointerDown($event)"
  (click)="onBackdropClick($event)"
>
  <div
    class="dialog-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="confirm-dialog-title"
    aria-describedby="confirm-dialog-message"
  >
    <header class="dialog-header">
      <h2 id="confirm-dialog-title" class="dialog-title">{{ title() }}</h2>
      <button
        type="button"
        class="close-btn"
        aria-label="Close dialog"
        (click)="cancel.emit()"
      >
        ×
      </button>
    </header>

    <div class="dialog-body">
      <p id="confirm-dialog-message" class="dialog-message">{{ message() }}</p>
    </div>

    <footer class="dialog-footer">
      <button type="button" class="dialog-btn" (click)="cancel.emit()">
        {{ cancelLabel() }}
      </button>
      <button
        #confirmButton
        type="button"
        class="dialog-btn primary"
        (click)="confirm.emit()"
      >
        {{ confirmLabel() }}
      </button>
    </footer>
  </div>
</div>
